<script>
const STEPS = [
  {
    id:'S04-01', title:'1000자 메시지 전송 — 성공', ok:true, cat:'경계값', http:'200',
    desc:'채팅 메시지의 최대 길이(MESSAGE_MAX_LENGTH=1000)에 정확히 맞는 메시지를 전송합니다. 정상적으로 브로드캐스트됩니다.',

  {

{

  {

let current = 0;

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = STEPS.map((s, i) => {
    let cls = s.ok ? 'ok' : 'err';
    if (i === current) cls += ' active';
    return `<div class="tab ${cls}" onclick="goTo(${i})">${s.id}</div>`;
  }).join('');
}

function renderStep() {
  const s = STEPS[current];
  document.getElementById('phone-screen').innerHTML = s.screen;
  document.getElementById('phone-user-label').textContent = s.userLabel;
  document.getElementById('step-id-badge').textContent = s.id;
  document.getElementById('status-badge').innerHTML = s.ok
    ? '<span class="badge-ok">✓ 성공</span>'
    : '<span class="badge-err">✕ 오류</span>';
  document.getElementById('category-badge').innerHTML = `<span class="category-badge">${s.cat}</span>`;
  const httpCls = {'200':'http-200','403':'http-403','401':'http-401','400':'http-400','WS ERR':'http-400'}[s.http] || '';
  document.getElementById('http-badge').innerHTML = `<span class="http-status ${httpCls}">${s.http}</span>`;
  document.getElementById('step-title').textContent = s.title;
  document.getElementById('step-desc').textContent = s.desc;
  const m = document.getElementById('api-method');
  m.textContent = s.method; m.className = 'method ' + s.method.toLowerCase();
  document.getElementById('api-path').textContent = s.path;
  document.getElementById('api-request').innerHTML = s.request;
  const r = document.getElementById('api-response');
  r.innerHTML = s.response; r.className = 'code-block res ' + (s.ok ? 'ok' : 'err');
  document.getElementById('nav-counter').textContent = `${current + 1} / ${STEPS.length}`;
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === STEPS.length - 1;
  renderTabs();
}

function goTo(i) { current = i; renderStep(); }
function navigate(d) { if (current + d >= 0 && current + d < STEPS.length) goTo(current + d); }
renderStep();
