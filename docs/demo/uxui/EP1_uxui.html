</head>

let currentStep = 0;

function renderTabs() {
  const nav = document.getElementById('tabNav');
  nav.innerHTML = STEPS.map((s, i) =>
    '<button class="tab-btn' + (i === currentStep ? ' active' : '') + '" onclick="goStep(' + i + ')">'
    + (i + 1) + '. ' + s.title
    + '</button>'
  ).join('');
}

function renderStep(index) {
  const step = STEPS[index];

  // Info panel
  const info = document.getElementById('infoPanel');
  let shootingHTML = '';
  if (step.shooting) {
    shootingHTML =
      '<div class="shooting-box">'
      + '<div class="narration-label">촬영 포인트</div>'
      + '<div class="narration-text">' + step.shooting + '</div>'
      + '</div>';
  }
  info.innerHTML =
    '<div class="step-badge">SCENE ' + (index + 1) + ' / ' + STEPS.length + '</div>'
    + '<h2 class="step-title">' + step.title + '</h2>'
    + '<span class="frame-type-tag ' + step.frameType + '">'
    + (step.frameType === 'browser' ? 'BROWSER — 백오피스' : 'iPHONE — 모바일 앱')
    + '</span>'
    + '<div class="narration-box">'
    + '<div class="narration-label">나레이션</div>'
    + '<div class="narration-text">' + step.narration + '</div>'
    + '</div>'
    + shootingHTML;

  // Frame area
  const frame = document.getElementById('frameArea');
  if (step.frameType === 'browser') {
    frame.innerHTML =
      '<div class="browser-frame">'
      + '<div class="browser-titlebar">'
      + '<span class="browser-dot red"></span>'
      + '<span class="browser-dot yellow"></span>'
      + '<span class="browser-dot green"></span>'
      + '<div class="browser-url">' + (step.url || 'admin.danngam.com') + '</div>'
      + '</div>'
      + '<div class="browser-body">' + step.screen + '</div>'
      + '</div>';
  } else {
    frame.innerHTML =
      '<div class="iphone-frame">'
      + '<div class="iphone-notch"></div>'
      + '<div class="iphone-screen">'
      + '<div class="iphone-screen-inner">' + step.screen + '</div>'
      + '</div>'
      + '</div>';
  }

  // Nav
  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').disabled = index === STEPS.length - 1;
  document.getElementById('navCounter').textContent = (index + 1) + ' / ' + STEPS.length;

  // Scroll active tab into view
  renderTabs();
  const activeTab = document.querySelector('.tab-btn.active');
  if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function goStep(index) {
  if (index < 0 || index >= STEPS.length) return;
  currentStep = index;
  renderStep(currentStep);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') goStep(currentStep - 1);
  if (e.key === 'ArrowRight') goStep(currentStep + 1);
});

// Init
renderStep(0);
</script>
