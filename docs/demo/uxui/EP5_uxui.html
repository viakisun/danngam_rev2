    step.render(screen);
    phone.appendChild(screen);
    scene.appendChild(phone);
  } else {
    const browser = document.createElement('div');
    browser.className = 'browser';
    const bar = document.createElement('div');
    bar.className = 'browser-bar';
    bar.innerHTML = `<span class="browser-dot r"></span><span class="browser-dot y"></span><span class="browser-dot g"></span><span class="browser-url">${step.url||''}</span>`;
    const content = document.createElement('div');
    content.className = 'browser-content';
    content.style.padding = '0';
    step.render(content);
    browser.appendChild(bar);
    browser.appendChild(content);
    scene.appendChild(browser);
  }

  scenesEl.appendChild(scene);
});

// Part B separator in tabs
const allTabs = tabsEl.querySelectorAll('.tab');
if (allTabs.length > 8) {
  const sep = document.createElement('div');
  sep.style.cssText = 'width:100%;text-align:center;font-size:10px;font-weight:700;color:#64748b;padding:2px 0;margin-top:4px;';
  sep.textContent = '--- Part B: 스케줄링 ---';
  tabsEl.insertBefore(sep, allTabs[8]);
}

function showStep(idx) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.scene').forEach((s, i) => s.classList.toggle('active', i === idx));
}
</script>
</body>
</html>
