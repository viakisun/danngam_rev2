<div class="header">

<script>

  {

    desc:'김민준(의뢰자)이 충남 논산시 벼베기 작업을 등록합니다. 3000평, 긴급(is_urgent=true), 평당 5,000원. 등록 후 status=OPEN으로 생성됩니다.',
    method:'POST', path:'/api/v1/jobs',
    request:`{
  <span class="k">"title"</span>: <span class="vs">"논산 벼베기 작업 구합니다"</span>,

  <span class="k">"success"</span>: <span class="vb-t">true</span>,
  <span class="k">"data"</span>: {
    <span class="k">"id"</span>: <span class="vs">"a1b2c3d4-..."</span>,
    <span class="k">"title"</span>: <span class="vs">"논산 벼베기 작업 구합니다"</span>,
    <span class="k">"status"</span>: <span class="vs">"OPEN"</span>,
    <span class="k">"is_urgent"</span>: <span class="vb-t">true</span>,

    userLabel:'사용자 A — 김민준 (의뢰자)',
    screen:`<div>

      </div>
    </div>`
  },
  {
    id:'S02-02', title:'작업자 B — 반경 5km 작업 목록 조회', ok:true, who:'B',
    desc:'이철수(작업자)가 현재 위치(논산, A로부터 3km) 기준 반경 5km 내 작업을 조회합니다. 긴급 작업이 최상단에 표시됩니다.',

    request:`<span style="color:#64748b">// Query Parameters</span>
lat=<span class="vn">36.17</span>
lng=<span class="vn">127.10</span>
radius_km=<span class="vn">5</span>
limit=<span class="vn">20</span>`,

    <span class="k">"items"</span>: [{
      <span class="k">"id"</span>: <span class="vs">"a1b2c3d4-..."</span>,
      <span class="k">"title"</span>: <span class="vs">"논산 벼베기 작업 구합니다"</span>,

    screen:`<div>

  {

    desc:'이철수가 WORKER 역할로 전환 후 김민준의 작업에 지원합니다. 지원 메시지와 함께 신청이 접수됩니다.',

    request:`{
  <span class="k">"message"</span>: <span class="vs">"콤바인 보유, 논산 지역 경험 10년입니다. 빠른 처리 가능합니다."</span>

  <span class="k">"success"</span>: <span class="vb-t">true</span>,
  <span class="k">"data"</span>: {

  <span class="k">"error"</span>: <span class="vb-f">null</span>
}`,

        <div style="background:#f8fafc;border-radius:8px;padding:10px;margin-top:8px;font-size:11px;color:#64748b;line-height:1.5;">
          💡 <strong>의뢰자</strong>로 등록한 작업입니다. 작업자를 선택하거나 작업을 수정할 수 있습니다.
        </div>
      </div>
    </div>`
  }
];

let current = 0;

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = STEPS.map((s, i) => `
    <div class="tab ${s.ok ? '' : 'error'} ${i === current ? 'active' : ''}" onclick="goTo(${i})">${s.id}</div>
  `).join('');
}

function renderStep() {
  const s = STEPS[current];
  document.getElementById('phone-screen').innerHTML = s.screen;
  document.getElementById('phone-user-label').textContent = s.userLabel;
  document.getElementById('step-id-badge').textContent = s.id;
  document.getElementById('status-badge').innerHTML = s.ok
    ? '<span class="badge-ok">✓ 성공</span>'
    : '<span class="badge-err">✕ 오류/시나리오</span>';
  const whoMap = {A:'<span class="who-badge who-a">사용자 A (의뢰자)</span>', B:'<span class="who-badge who-b">사용자 B (작업자)</span>', 'A/B':'<span class="who-badge who-a">A</span> <span class="who-badge who-b">B</span>'};
  document.getElementById('who-badge').innerHTML = whoMap[s.who] || '';
  document.getElementById('step-title').textContent = s.title;
  document.getElementById('step-desc').textContent = s.desc;
  const methodEl = document.getElementById('api-method');
  methodEl.textContent = s.method;
  methodEl.className = 'method ' + s.method.toLowerCase();
  document.getElementById('api-path').textContent = s.path;
  document.getElementById('api-request').innerHTML = s.request;
  const resEl = document.getElementById('api-response');
  resEl.innerHTML = s.response;
  resEl.className = 'code-block res ' + (s.ok ? 'ok' : 'err');
  document.getElementById('nav-counter').textContent = `${current + 1} / ${STEPS.length}`;
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === STEPS.length - 1;
  renderTabs();
}

function goTo(i) { current = i; renderStep(); }
function navigate(d) { if (current + d >= 0 && current + d < STEPS.length) goTo(current + d); }
renderStep();
</script>
</body>
</html>
